services:
  # 1. Local LLM Server (Gemma via llama.cpp)
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: sloth-llama
    restart: unless-stopped
    command: >
      -m /models/${LLAMA_MODEL_FILE:-gemma-2-2b-it-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      -c 8192
      -np 1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models:ro

  # 2. Temporal Dev Server (Persistent SQLite storage + Built-in Web UI, non-root 'temporal' user)
  temporal:
    image: temporalio/admin-tools:latest
    container_name: sloth-temporal
    restart: unless-stopped
    entrypoint: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/home/temporal

  # 3. Self-hosted ntfy Push Notification Gateway
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: sloth-ntfy
    restart: unless-stopped
    command: serve --cache-file /var/cache/ntfy/cache.db
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy

  # 4. Sloth Digest Application (Unified Worker + LAN Dashboard, non-root 'node' user)
  app:
    build: .
    image: sloth-app:latest
    pull_policy: build
    container_name: sloth-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-to-container service networking overrides
      - LLAMA_SERVER_URL=http://llama-server:8080
      - TEMPORAL_ADDRESS=temporal:7233
      - NTFY_URL=http://ntfy/sloth-digest
      - SQLITE_DB_PATH=/app/data/sloth.db
      - DIGEST_OUTPUT_DIR=/app/data/digests
      - WEB_PORT=${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - sloth_data:/app/data
    depends_on:
      - temporal
      - llama-server
      - ntfy

volumes:
  sloth_data:
  temporal_data:
  ntfy_cache:
